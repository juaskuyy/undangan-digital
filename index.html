<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b29">
<title>Undangan Pernikahan</title>
<style>
*{box-sizing:border-box}
html{margin:0;background:#102b29;scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;overflow-x:hidden;background:#102b29;font-family:Georgia,'Times New Roman',serif}
main{width:100%;max-width:520px;margin:0 auto;background:#e6e7d2;box-shadow:0 0 32px #0004}
.cover{height:100svh;height:100dvh;min-height:520px;position:relative;overflow:hidden;isolation:isolate;background:#102b29;cursor:pointer;touch-action:manipulation}
.door{position:absolute;inset:0;display:flex;perspective:1500px;z-index:2;pointer-events:none}
.leaf{width:50%;height:100%;flex:0 0 50%;background-image:url('assets/halaman-01.webp');background-repeat:no-repeat;background-size:200% 100%;transition:transform 1.8s cubic-bezier(.72,0,.18,1);will-change:transform;backface-visibility:hidden}
.leaf.left{background-position:left center;transform-origin:left center;border-right:2px solid #149b85}
.leaf.right{background-position:right center;transform-origin:right center;border-left:2px solid #149b85}
.cover.open .leaf.left{transform:rotateY(-115deg) translateX(-6%)}
.cover.open .leaf.right{transform:rotateY(115deg) translateX(6%)}
.hint{position:absolute;z-index:4;bottom:max(25px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f5e7cb;font:11px Arial,sans-serif;letter-spacing:.2em;text-shadow:0 2px 8px #000;pointer-events:none;animation:pulse 1.8s infinite}
.cover.open .hint{opacity:0;transition:opacity .3s}
@keyframes pulse{50%{opacity:.55}}
.gallery{display:none}
.gallery.show{display:block}
.instruction{padding:17px 10px;text-align:center;background:#f4ecd9;color:#315641;font:10px Arial,sans-serif;letter-spacing:.16em}
.scene{margin:0;position:relative;line-height:0;overflow:hidden;background:#e7e8d5}
.scene img{display:block;width:100%;height:auto;opacity:0;transform:translateY(18px) scale(1.015);transition:opacity .8s ease,transform 1.1s ease}
.scene.seen img{opacity:1;transform:translateY(0) scale(1)}
footer{background:#f4ecd9;color:#254d3b;text-align:center;padding:25px 18px 36px;line-height:1.6}
footer p{font:12px/1.8 Arial,sans-serif;margin:5px}
footer a{display:inline-block;margin-top:13px;padding:11px 18px;border:1px solid #4f8068;border-radius:30px;text-decoration:none;color:#254d3b;font:11px Arial,sans-serif;letter-spacing:.08em}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.leaf,.scene img{transition:none}.hint{animation:none}}
</style>
</head>
<body>
<main>
<section class="cover" id="cover" aria-label="Sentuh untuk membuka undangan" role="button" tabindex="0">
  <div class="door" aria-hidden="true"><div class="leaf left"></div><div class="leaf right"></div></div>
  <div class="hint">SENTUH UNTUK MEMBUKA</div>
</section>
<div class="gallery" id="gallery">
  <div class="instruction">GULIR KE BAWAH UNTUK MELIHAT UNDANGAN</div>
  <figure class="scene"><img src="assets/adegan-01.webp" alt="Undangan Pernikahan" fetchpriority="high"></figure>
  <figure class="scene"><img src="assets/adegan-02.webp" alt="Nama kedua mempelai dan keluarga" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-03.webp" alt="Pembukaan dan doa" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-04.webp" alt="Ilustrasi pengantin" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-05.webp" alt="Nama mempelai dan orang tua" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-06.webp" alt="Nama mempelai pria" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-07.webp" alt="Hari dan tanggal pernikahan" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-08.webp" alt="Informasi akad dan resepsi" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-09.webp" alt="Kode QR undangan" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-10.webp" alt="Scan Google Maps" loading="lazy"></figure>
  <figure class="scene"><img src="assets/adegan-11.webp" alt="Ucapan terima kasih" loading="lazy"></figure>
  <footer>
    <p>Terima kasih atas doa dan kehadiran Anda.</p>
    <a href="https://www.google.com/maps/search/?api=1&amp;query=Kp+Ciharus+Lebak+Desa+Girijaya+Cikajang+Garut" target="_blank" rel="noopener">BUKA LOKASI</a>
  </footer>
</div>
</main>
<script>
(() => {
 const cover=document.getElementById('cover'), gallery=document.getElementById('gallery');
 let opened=false;
 function openInvite(){
  if(opened)return; opened=true;
  cover.classList.add('open'); gallery.classList.add('show');
  cover.setAttribute('aria-label','Pintu terbuka');
  cover.removeAttribute('role'); cover.removeAttribute('tabindex');
  setTimeout(()=>gallery.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),1150);
 }
 cover.addEventListener('click',openInvite);
 cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite()}});
 const scenes=[...document.querySelectorAll('.scene')];
 if('IntersectionObserver' in window){
  const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');observer.unobserve(e.target)}}),{threshold:.08});
  scenes.forEach(s=>observer.observe(s));
 } else scenes.forEach(s=>s.classList.add('seen'));
})();
</script>
</body>
</html>
