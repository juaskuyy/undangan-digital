<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092f2c">
<title>Undangan Pernikahan</title>
<style>
*{box-sizing:border-box}html{background:#092f2c;scroll-behavior:smooth;overflow-x:hidden}body{margin:0;background:#092f2c;font-family:Georgia,'Times New Roman',serif;overflow-x:hidden;color:#f8eed8}
.site{width:100%;max-width:520px;margin:0 auto;background:#dfe8d9;box-shadow:0 0 36px #0005}
.cover{height:100svh;height:100dvh;min-height:540px;position:relative;overflow:hidden;background:#102a28;isolation:isolate;cursor:pointer}
.cover-art{position:absolute;inset:0;background:#102a28 url('assets/halaman-01.webp') center/100% 100% no-repeat}
.cover-art:before,.cover-art:after{content:"";position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(130deg,#2d4140,#122321 75%);border:3px solid #198c7b;box-shadow:inset 0 0 18px #0008;transition:transform 1.65s cubic-bezier(.72,0,.18,1);z-index:2}
.cover-art:before{left:0;transform-origin:left center;border-right:2px solid #42c8ae}
.cover-art:after{right:0;transform-origin:right center;border-left:2px solid #42c8ae}
.handle{position:absolute;z-index:3;top:42%;height:24%;width:5px;border-radius:9px;background:linear-gradient(90deg,#64777c,#f4f5f4,#66767b);box-shadow:0 0 2px #fff;transition:opacity .4s}
.handle:before,.handle:after{content:"";position:absolute;left:-6px;width:15px;height:15px;border-radius:50%;background:linear-gradient(90deg,#71888c,#f3f3ef,#687c7d)}
.handle:before{top:15%}.handle:after{bottom:15%}.handle.left{left:36%}.handle.right{right:36%}
.cover.open .cover-art:before{transform:perspective(900px) rotateY(-112deg)}.cover.open .cover-art:after{transform:perspective(900px) rotateY(112deg)}.cover.open .handle{opacity:0}
.cover-hint{position:absolute;z-index:4;bottom:max(28px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:11px Arial,sans-serif;letter-spacing:.22em;color:#f6e8cc;text-shadow:0 2px 10px #000}
.cover.open .cover-hint{opacity:0;transition:opacity .25s}
.cover-title{position:absolute;inset:0;z-index:1;display:grid;place-content:center;text-align:center;color:#f6e8cc;opacity:0;transition:opacity .9s 1s}
.cover-title small{font:10px Arial,sans-serif;letter-spacing:.3em}.cover-title strong{font-size:42px;font-weight:400;font-style:italic;margin-top:12px}
.cover.open .cover-title{opacity:1}
.music-button{position:fixed;z-index:20;right:max(14px,calc((100vw - 520px)/2 + 14px));bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid #fff9;background:#1d5549;color:#fff;box-shadow:0 3px 14px #0004;font:18px Arial,sans-serif;display:none;align-items:center;justify-content:center}
.music-button.show{display:flex}.music-button.playing{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.intro{padding:14px 10px;background:#f4ecd9;text-align:center;color:#355b46;font:10px Arial,sans-serif;letter-spacing:.15em}
.scroll-scene{height:145svh;height:145dvh;position:relative;background:#dfe8d9}
.sticky-frame{position:sticky;top:0;height:100svh;height:100dvh;max-height:1000px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#dfe8d9}
.sticky-frame img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;will-change:opacity;transition:opacity .12s linear}
.scroll-label{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:9px Arial,sans-serif;letter-spacing:.15em;color:#fff;text-shadow:0 2px 8px #000;opacity:.75;pointer-events:none}
footer{background:#f4ecd9;color:#254d3b;text-align:center;padding:32px 18px 60px;line-height:1.65}footer h2{font-size:34px;font-weight:400;font-style:italic;margin:0 0 10px}footer p{font:12px/1.8 Arial,sans-serif;margin:7px auto;max-width:330px}footer a{display:inline-block;margin-top:13px;padding:11px 19px;border:1px solid #4f8068;border-radius:30px;text-decoration:none;color:#254d3b;font:11px Arial,sans-serif;letter-spacing:.08em}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cover-art:before,.cover-art:after{transition:none}}
</style>
</head>
<body>
<main class="site">
<section class="cover" id="cover" aria-label="Sentuh untuk membuka undangan" role="button" tabindex="0">
 <div class="cover-art"></div><span class="handle left"></span><span class="handle right"></span>
 <div class="cover-title"><div><small>THE WEDDING OF</small><br><strong>Juaa &amp; Rawr</strong></div></div>
 <div class="cover-hint">SENTUH UNTUK MEMBUKA</div>
</section>
<div class="intro" id="intro">GULIR KE BAWAH — GERAKAN ADEGAN MENGIKUTI SCROLL</div>
<div id="scenes"></div>
<footer>
 <h2>Juaa &amp; Rawr</h2>
 <p>31 Oktober 2026</p>
 <p>Kp. Ciharus Lebak, RT/RW 02/04<br>Desa Girijaya, Kecamatan Cikajang, Garut</p>
 <a href="https://www.google.com/maps/search/?api=1&amp;query=Kp+Ciharus+Lebak+Desa+Girijaya+Cikajang+Garut" target="_blank" rel="noopener">BUKA LOKASI</a>
</footer>
</main>
<button class="music-button" id="musicBtn" aria-label="Putar atau jeda musik">♫</button>
<audio id="music" src="music.mp3" preload="none" loop></audio>
<script>
const sequences=[{"id": "scene01", "duration": 1.299989, "frames": ["frames/scene01/f-000.webp", "frames/scene01/f-001.webp", "frames/scene01/f-002.webp", "frames/scene01/f-003.webp", "frames/scene01/f-004.webp"]}, {"id": "scene02", "duration": 5.266667, "frames": ["frames/scene02/f-000.webp", "frames/scene02/f-001.webp", "frames/scene02/f-002.webp", "frames/scene02/f-003.webp", "frames/scene02/f-004.webp", "frames/scene02/f-005.webp", "frames/scene02/f-006.webp", "frames/scene02/f-007.webp", "frames/scene02/f-008.webp", "frames/scene02/f-009.webp", "frames/scene02/f-010.webp", "frames/scene02/f-011.webp", "frames/scene02/f-012.webp"]}, {"id": "scene03", "duration": 6.5, "frames": ["frames/scene03/f-000.webp", "frames/scene03/f-001.webp", "frames/scene03/f-002.webp", "frames/scene03/f-003.webp", "frames/scene03/f-004.webp", "frames/scene03/f-005.webp", "frames/scene03/f-006.webp", "frames/scene03/f-007.webp", "frames/scene03/f-008.webp", "frames/scene03/f-009.webp", "frames/scene03/f-010.webp", "frames/scene03/f-011.webp", "frames/scene03/f-012.webp", "frames/scene03/f-013.webp", "frames/scene03/f-014.webp", "frames/scene03/f-015.webp"]}, {"id": "scene04", "duration": 4.0, "frames": ["frames/scene04/f-000.webp", "frames/scene04/f-001.webp", "frames/scene04/f-002.webp", "frames/scene04/f-003.webp", "frames/scene04/f-004.webp", "frames/scene04/f-005.webp", "frames/scene04/f-006.webp", "frames/scene04/f-007.webp", "frames/scene04/f-008.webp", "frames/scene04/f-009.webp"]}, {"id": "scene05", "duration": 4.0, "frames": ["frames/scene05/f-000.webp", "frames/scene05/f-001.webp", "frames/scene05/f-002.webp", "frames/scene05/f-003.webp", "frames/scene05/f-004.webp", "frames/scene05/f-005.webp", "frames/scene05/f-006.webp", "frames/scene05/f-007.webp", "frames/scene05/f-008.webp", "frames/scene05/f-009.webp"]}, {"id": "scene06", "duration": 7.466667, "frames": ["frames/scene06/f-000.webp", "frames/scene06/f-001.webp", "frames/scene06/f-002.webp", "frames/scene06/f-003.webp", "frames/scene06/f-004.webp", "frames/scene06/f-005.webp", "frames/scene06/f-006.webp", "frames/scene06/f-007.webp", "frames/scene06/f-008.webp", "frames/scene06/f-009.webp", "frames/scene06/f-010.webp", "frames/scene06/f-011.webp", "frames/scene06/f-012.webp", "frames/scene06/f-013.webp", "frames/scene06/f-014.webp", "frames/scene06/f-015.webp", "frames/scene06/f-016.webp", "frames/scene06/f-017.webp", "frames/scene06/f-018.webp"]}, {"id": "scene07", "duration": 5.0, "frames": ["frames/scene07/f-000.webp", "frames/scene07/f-001.webp", "frames/scene07/f-002.webp", "frames/scene07/f-003.webp", "frames/scene07/f-004.webp", "frames/scene07/f-005.webp", "frames/scene07/f-006.webp", "frames/scene07/f-007.webp", "frames/scene07/f-008.webp", "frames/scene07/f-009.webp", "frames/scene07/f-010.webp", "frames/scene07/f-011.webp", "frames/scene07/f-012.webp"]}, {"id": "scene08", "duration": 5.0, "frames": ["frames/scene08/f-000.webp", "frames/scene08/f-001.webp", "frames/scene08/f-002.webp", "frames/scene08/f-003.webp", "frames/scene08/f-004.webp", "frames/scene08/f-005.webp", "frames/scene08/f-006.webp", "frames/scene08/f-007.webp", "frames/scene08/f-008.webp", "frames/scene08/f-009.webp", "frames/scene08/f-010.webp", "frames/scene08/f-011.webp", "frames/scene08/f-012.webp"]}, {"id": "scene09", "duration": 5.633333, "frames": ["frames/scene09/f-000.webp", "frames/scene09/f-001.webp", "frames/scene09/f-002.webp", "frames/scene09/f-003.webp", "frames/scene09/f-004.webp", "frames/scene09/f-005.webp", "frames/scene09/f-006.webp", "frames/scene09/f-007.webp", "frames/scene09/f-008.webp", "frames/scene09/f-009.webp", "frames/scene09/f-010.webp", "frames/scene09/f-011.webp", "frames/scene09/f-012.webp", "frames/scene09/f-013.webp"]}, {"id": "scene10", "duration": 1.533322, "frames": ["frames/scene10/f-000.webp", "frames/scene10/f-001.webp", "frames/scene10/f-002.webp", "frames/scene10/f-003.webp", "frames/scene10/f-004.webp", "frames/scene10/f-005.webp"]}];
const sceneRoot=document.getElementById('scenes');
const sceneEls=[];
sequences.slice(1,-1).forEach((seq,idx)=>{
 const section=document.createElement('section');section.className='scroll-scene';section.dataset.scene=seq.id;
 const sticky=document.createElement('div');sticky.className='sticky-frame';
 const img=document.createElement('img');img.alt='Adegan undangan '+(idx+1);img.loading=idx===0?'eager':'lazy';img.decoding='async';
 img.src=seq.frames[0];sticky.appendChild(img);
 const label=document.createElement('div');label.className='scroll-label';label.textContent='GULIR UNTUK MELANJUTKAN';sticky.appendChild(label);
 section.appendChild(sticky);sceneRoot.appendChild(section);sceneEls.push({section,img,seq,last:-1});
});
function updateFrames(){
 const vh=window.innerHeight||innerHeight;
 for(const item of sceneEls){
   const r=item.section.getBoundingClientRect();
   const travel=Math.max(1,item.section.offsetHeight-vh);
   const progress=Math.max(0,Math.min(1,-r.top/travel));
   const idx=Math.min(item.seq.frames.length-1,Math.floor(progress*(item.seq.frames.length-1)+.5));
   if(idx!==item.last){item.img.src=item.seq.frames[idx];item.last=idx;}
 }
}
let raf=0;window.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{updateFrames();raf=0;})},{passive:true});
window.addEventListener('resize',updateFrames);updateFrames();
const cover=document.getElementById('cover'),music=document.getElementById('music'),musicBtn=document.getElementById('musicBtn');let opened=false;
async function openInvite(){
 if(opened)return;opened=true;cover.classList.add('open');musicBtn.classList.add('show');
 try{await music.play();musicBtn.classList.add('playing');musicBtn.textContent='♫';}catch(e){musicBtn.textContent='▶';}
 setTimeout(()=>document.getElementById('intro').scrollIntoView({behavior:'smooth',block:'start'}),1050);
}
cover.addEventListener('click',openInvite);cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInvite();}});
musicBtn.addEventListener('click',async()=>{if(music.paused){try{await music.play();musicBtn.classList.add('playing');musicBtn.textContent='♫';}catch(e){}}else{music.pause();musicBtn.classList.remove('playing');musicBtn.textContent='▶';}});
</script>
</body>
</html>
