<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generator Link Tamu — Santi & Syauqi</title>
<style>
body{margin:0;padding:18px;background:#f5e6d8;color:#244536;font:17px system-ui;max-width:760px;margin:auto}h1{font:40px Georgia,serif;text-align:center;color:#31553f}.intro{text-align:center}.card{background:#fff8ef;border:1px solid #cbb48e;border-radius:14px;padding:16px;margin:14px 0}label{display:block;margin:10px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbbca5;border-radius:8px;font:inherit;color:#244536;background:#fffdf8}button{border:0;border-radius:22px;background:#31553f;color:white;padding:11px 16px;margin:8px 6px 0 0;font-weight:600}.item{border-top:1px solid #dfd0bb;padding:12px 0;overflow-wrap:anywhere}.muted{font-size:13px;color:#786c5e}
</style></head><body><h1>Santi &amp; Syauqi</h1><p class="intro">Generator Link Undangan Personal</p>
<div class="card"><label>Alamat website undangan</label><input id="base" value="https://santi-syauqi.everafter.my.id/"><p class="muted">Ubah alamat ini jika subdomain undangan berbeda.</p></div>
<div class="card"><label>Nama tamu (satu nama per baris)</label><textarea id="names" rows="6" placeholder="Bapak Ahmad & Keluarga&#10;Kak Dina&#10;Keluarga Budi"></textarea><button id="make">Buat link</button><button id="copyall">Salin semua</button><button id="csv">Unduh CSV</button><p id="status" class="muted"></p></div>
<div class="card"><b>Link undangan</b><div id="list" class="muted">Masukkan nama tamu lalu tekan Buat link.</div></div>
<script>
let guests=[];const $=x=>document.getElementById(x);
function makeUrl(name){let b=$('base').value.trim();if(!/^https?:\/\//i.test(b))b='https://'+b;let u=new URL(b);u.search='';u.hash='';u.searchParams.set('to',name);return u.toString()}
function render(){let list=$('list');list.replaceChildren();guests.forEach(g=>{let d=document.createElement('div');d.className='item';let n=document.createElement('div');n.textContent=g.name;let a=document.createElement('div');a.textContent=g.url;let b=document.createElement('button');b.textContent='Salin link';b.onclick=async()=>{try{await navigator.clipboard.writeText(g.url);$('status').textContent='Link disalin.'}catch{$('status').textContent='Tekan lama tautan untuk menyalin.'}};d.append(n,a,b);list.append(d)})}
$('make').onclick=()=>{try{let names=[...new Set($('names').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];if(!names.length){$('status').textContent='Masukkan nama tamu terlebih dahulu.';return}guests=names.map(name=>({name,url:makeUrl(name)}));render();$('status').textContent=guests.length+' link berhasil dibuat.'}catch(e){$('status').textContent='Periksa alamat website.'}};
$('copyall').onclick=async()=>{if(!guests.length){$('status').textContent='Buat link terlebih dahulu.';return}try{await navigator.clipboard.writeText(guests.map(g=>g.name+'\n'+g.url).join('\n\n'));$('status').textContent='Semua link disalin.'}catch{$('status').textContent='Clipboard tidak tersedia.'}};
$('csv').onclick=()=>{if(!guests.length){$('status').textContent='Buat link terlebih dahulu.';return}let s='Nama Tamu,Link Undangan\n'+guests.map(g=>'"'+g.name.replace(/"/g,'""')+'","'+g.url.replace(/"/g,'""')+'"').join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}));a.download='daftar-tamu-santi-syauqi.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
