<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generator Link Undangan Santi & Syauqi</title>
<style>
body{margin:0;padding:20px;background:#111;color:#f8f2e6;font:16px system-ui;max-width:780px;margin:auto}h1{font-family:Georgia,serif;text-align:center;color:#d3b477}p{color:#c8c0b1}.panel{border:1px solid #514735;border-radius:15px;padding:16px;margin:14px 0;background:#1b1b1b}label{display:block;margin:10px 0 6px;color:#d3b477}input,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #514735;background:#101010;color:white;font:inherit}button{padding:11px 14px;border:0;border-radius:9px;background:#d3b477;color:#17130d;font-weight:bold;margin:10px 6px 0 0}button.alt{background:#333;color:white;border:1px solid #555}.entry{border-top:1px solid #444;padding:12px 0;overflow-wrap:anywhere}.muted{font-size:13px;color:#b9b0a0}
</style>
<h1>Santi &amp; Syauqi</h1><p style="text-align:center">Generator link undangan personal</p>
<div class="panel"><label>Alamat dasar undangan</label><input id="base" value="https://santi-syauqi.everafter.my.id/"><p class="muted">Pastikan alamat ini sudah aktif.</p></div>
<div class="panel"><label>Nama tamu (satu nama per baris)</label><textarea id="names" rows="6" placeholder="Bapak Ahmad & Keluarga&#10;Kak Dina&#10;Keluarga Budi"></textarea><button onclick="generate()">Buat link tamu</button><button class="alt" onclick="copyAll()">Salin semua</button><button class="alt" onclick="downloadCsv()">Unduh CSV</button><p id="status" class="muted"></p></div>
<div class="panel"><b>Daftar link undangan</b><div id="list" class="muted">Belum ada link.</div></div>
<script>
let guests=[];
function urlFor(name){let base=document.getElementById('base').value.trim();if(!/^https?:\/\//i.test(base))base='https://'+base;let u=new URL(base);u.search='';u.hash='';u.searchParams.set('to',name);return u.toString()}
function generate(){let names=[...new Set(document.getElementById('names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];if(!names.length){document.getElementById('status').textContent='Masukkan nama tamu dulu.';return}try{guests=names.map(name=>({name,url:urlFor(name)}));render();document.getElementById('status').textContent='Berhasil membuat '+guests.length+' link.'}catch(e){document.getElementById('status').textContent='Alamat tidak valid.'}}
function render(){let list=document.getElementById('list');list.replaceChildren();guests.forEach(g=>{let d=document.createElement('div');d.className='entry';let b=document.createElement('button');b.textContent='Salin link';b.onclick=async()=>{try{await navigator.clipboard.writeText(g.url);document.getElementById('status').textContent='Link disalin.'}catch{document.getElementById('status').textContent='Tekan lama link untuk menyalin.'}};let n=document.createElement('div');n.textContent=g.name;let a=document.createElement('div');a.textContent=g.url;d.append(n,a,b);list.append(d)})}
async function copyAll(){if(!guests.length){document.getElementById('status').textContent='Buat link dulu.';return}let t=guests.map(g=>g.name+'\n'+g.url).join('\n\n');try{await navigator.clipboard.writeText(t);document.getElementById('status').textContent='Semua link disalin.'}catch{document.getElementById('status').textContent=t}}
function downloadCsv(){if(!guests.length){document.getElementById('status').textContent='Buat link dulu.';return}let csv='Nama Tamu,Link Undangan\n'+guests.map(g=>'"'+g.name.replace(/"/g,'""')+'","'+g.url+'"').join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='daftar-tamu-santi-syauqi.csv';a.click();URL.revokeObjectURL(a.href)}
</script></html>
